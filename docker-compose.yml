services:
  db:
    image: postgres:16-alpine
    container_name: as_english_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-as_english}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-as_english}
      POSTGRES_DB: ${POSTGRES_DB:-as_english}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-as_english} -d ${POSTGRES_DB:-as_english}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: as_english_web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-as_english}:${POSTGRES_PASSWORD:-as_english}@db:5432/${POSTGRES_DB:-as_english}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me-in-production-as-english-32chars}
      AUTH_URL: ${APP_URL:-http://localhost:8010}
      NEXTAUTH_URL: ${APP_URL:-http://localhost:8010}
      CA_PORT: ${CA_PORT:-8011}
      SEED_ON_START: ${SEED_ON_START:-true}
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: caddy:2-alpine
    container_name: as_english_proxy
    restart: unless-stopped
    user: root
    depends_on:
      - web
    expose:
      - "8443"
      - "8081"
    ports:
      - "${CA_PORT:-8011}:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs/cert.pem:/certs/cert.pem:ro
      - ./certs/key.pem:/certs/key.pem:ro
      - ./certs/rootCA.pem:/ca/rootCA.pem:ro

  edge:
    image: haproxy:2.8-alpine
    container_name: as_english_edge
    restart: unless-stopped
    depends_on:
      - proxy
    ports:
      - "${APP_PORT:-8010}:8010"
    volumes:
      - ./deploy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro

volumes:
  postgres_data:
